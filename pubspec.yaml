name: parche_iot_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  mqtt_client: ^10.0.0
  geocoding: ^2.1.0
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  

dev_dependencies:
